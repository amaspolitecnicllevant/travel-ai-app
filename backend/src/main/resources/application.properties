spring.application.name=travel-ai-backend
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:travelai}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:travel-ai-super-secret-key-change-in-production-min-32-chars}
jwt.expiration=86400000

# Anthropic Claude (optional - enables AI itinerary generation)
anthropic.api-key=${ANTHROPIC_API_KEY:}

# Jackson - serialize LocalDate as string
spring.jackson.serialization.write-dates-as-timestamps=false
